<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 6 98 82" fill="none">
  <defs>
    <linearGradient id="blue" x1="20" y1="80" x2="104" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.45" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="22" y1="36" x2="100" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d99a06"/>
      <stop offset="0.5" stop-color="#fde047"/>
